[package]
name = "speech-connector"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Standalone speech provider contract and local Qwen connector"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
thiserror = "2"
fs2 = "0.4"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
