[package]
name = "slopslide"
version = "0.1.0"
description = "Chat-driven slide editor"
authors = ["Matthias Rieck"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "slopslide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
notify = "8"
notify-debouncer-mini = "0.7"
which = "8"
thiserror = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
base64 = "0.23.1"
png = "0.18"
fs2 = "0.4"

# Slide screenshots for sketches (see src/capture.rs); the same versions wry already uses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError"] }
objc2-web-kit = { version = "0.3", features = ["block2", "objc2-app-kit", "WKSnapshotConfiguration", "WKWebView"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
