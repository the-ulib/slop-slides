<template id="ss-shell">

<script>
(() => {
  const root = document.getElementById('narration-workflow');
  const shell = document.getElementById('ss-shell');
  const titles = ['A better starting point','Knowledge that stays','Less searching, more progress','Build it into the workflow','Start small','The next step'];
  const passage = 'On a bright morning, we gathered around the table to share fresh ideas. The next step is simple: choose a clear goal, ask a few questions, and show how small changes can make a difference.';
  const germanPassage = 'Am frühen Morgen treffen wir uns, um frische Ideen zu besprechen. Für den nächsten Schritt wählen wir ein klares Ziel, prüfen verschiedene Möglichkeiten und erklären ruhig, warum kleine Veränderungen einen großen Unterschied machen.';
  const saved = globalThis.openai?.widgetState;
  root.querySelectorAll('.ss-app').forEach(app => {
    app.append(shell.content.cloneNode(true));
    const q = s => app.querySelector(s);
    const all = s => app.querySelectorAll(s);
    const design = app.dataset.design;
    const state = {slide:1,scope:'slide',tab:'narration',ready:[true,true,false,false,false,false],scripts:titles.map((t,i) => i===1 ? q('[data-script]').value : `Let us look at ${t.toLowerCase()}. This is the next step toward turning useful ideas into everyday progress.`),presenters:titles.map(()=>'Ryan · English'),languages:titles.map(()=>'English'),paces:titles.map(()=>'1.1× · Natural'),takes:[{name:'Take 2',time:'0:24',voice:'Ryan',presenter:'Ryan · English',script:q('[data-script]').value,used:true},{name:'Take 1',time:'0:28',voice:'Ryan',presenter:'Ryan · English',script:q('[data-script]').value,used:false}],voices:[],focus:null,voiceStep:'source',playing:false};
    if(saved?.privateContent?.[design]?.tab === 'chat') state.tab = 'chat';
    const escape = text => String(text).replace(/[&<>"']/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function remember(){
      if(!globalThis.openai?.setWidgetState) return;
      const previous = globalThis.openai.widgetState || {};
      globalThis.openai.setWidgetState({modelContent:{mockup:design,view:state.scope},privateContent:{...previous.privateContent,[design]:{tab:state.tab}}}).catch(()=>{});
    }
    function notice(message){q('[data-notice]').textContent=message;}
    function setTab(tab){state.tab=tab;all('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));q('[data-chat]').hidden=tab!=='chat';q('[data-narration]').hidden=tab!=='narration';}
    function setScope(scope){state.scope=scope;all('[data-scope]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.scope===scope)));q('[data-slide-panel]').hidden=scope!=='slide';q('[data-deck-panel]').hidden=scope!=='deck';q('[data-footer]').hidden=design==='workspace'&&scope==='slide';}
    function refresh(){
      q('[data-slide-title]').textContent=titles[state.slide];q('[data-panel-title]').textContent=titles[state.slide];q('[data-slide-number]').textContent=state.slide+1;q('[data-slide-caption]').textContent=`Slide ${state.slide+1}`;
      q('[data-script]').value=state.scripts[state.slide];
      q('[data-presenter]').value=state.presenters[state.slide];q('[data-language]').value=state.languages[state.slide];q('[data-pace]').value=state.paces[state.slide];
      q('[data-script-status]').textContent=state.scripts[state.slide].trim()?'Saved · approximately 24 seconds':'No narration · 5 seconds of silence';
      q('[data-silent-control]').hidden=!!state.scripts[state.slide].trim();
      q('[data-audio-status]').textContent=state.ready[state.slide]?'✓ Audio ready for video · 0:24':state.scripts[state.slide].trim()?'Audio needs to be generated':'Silent slide · 5 seconds';
      q('[data-generate-label]').textContent=state.ready[state.slide]?'Generate another take':'Generate audio';
      const count=state.ready.filter((ready,i)=>ready||!state.scripts[i].trim()).length;q('[data-ready]').textContent=`${count} of 6 ready`;q('[data-deck-summary]').textContent=`${count} of 6 slides ready`;q('[data-missing-summary]').textContent=count===6?'All slides are ready to preview and export.':`${6-count} slides need audio.`;
      all('.ss-thumb').forEach(b=>{const i=Number(b.dataset.slide);b.setAttribute('aria-pressed',String(i===state.slide));b.querySelector('[data-thumb-status]').textContent=state.ready[i]?'✓ Audio ready':state.scripts[i].trim()?'Needs audio':'Silent · 5s';});
      q('[data-take-count]').textContent=`(${state.slide===1?state.takes.length:state.ready[state.slide]?1:0})`;
      q('[data-takes]').innerHTML=state.slide===1?state.takes.map((t,i)=>`<div class="ss-history-row"><span>${escape(t.name)} · ${escape(t.time)}<br><span class="ss-muted">${escape(t.voice)}${t.used?' · Used in video':''}</span></span><div class="ss-row"><button class="ss-quiet cursor-interaction" data-audition="${i}">Listen</button><button class="cursor-interaction" data-use="${i}" ${t.used&&t.script===state.scripts[state.slide]?'disabled':''}>${t.script===state.scripts[state.slide]?'Use':'Use &amp; script'}</button></div></div>`).join(''):'<p class="ss-muted">Recordings belong to this slide.</p>';
    }
    q('.ss-thumbs').innerHTML=titles.map((t,i)=>`<button class="ss-thumb cursor-interaction" data-slide="${i}" aria-pressed="${i===1}"><span>${i+1}</span>${escape(t)}<span class="ss-thumb-status" data-thumb-status></span></button>`).join('');
    if(design==='workspace'){
      q('[data-subtabs]').hidden=false;q('[data-overview]').hidden=true;q('[data-footer-heading]').textContent='Video';
      q('[data-script-group]').after(q('[data-presenter-group]'));
    }
    function close(){q('[data-overlay]').hidden=true;if(state.focus?.isConnected)state.focus.focus();}
    function dialog(html,label){if(q('[data-overlay]').hidden)state.focus=document.activeElement;q('[data-dialog]').innerHTML=html;q('[data-dialog]').setAttribute('aria-label',label);q('[data-overlay]').hidden=false;q('[data-dialog] button, [data-dialog] input')?.focus();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
    function voiceSource(){
      state.voiceStep='source';
      dialog(`<div class="ss-row ss-between"><h2>Create a presenter</h2><button class="ss-quiet cursor-interaction" data-action="close" aria-label="Close presenter creation">✕</button></div><span class="ss-muted">1 · Reference recording &nbsp; → &nbsp; 2 · Preview &amp; save</span><label class="ss-label">Presenter name<input data-voice-name value="${escape(state.voiceName||'')}" aria-label="Presenter name"></label><label class="ss-label">Main narration language<select data-voice-language><option ${state.voiceLanguage!=='German'?'selected':''}>English</option><option ${state.voiceLanguage==='German'?'selected':''}>German</option></select></label><div class="ss-row"><button class="ss-primary cursor-interaction" data-action="import-reference">Import reference audio…</button><button class="cursor-interaction" data-action="record-prep">Record here</button></div><p class="ss-muted">Use a clear 10–20 second recording. You can reuse this presenter in other decks.</p><div data-record-prep hidden class="ss-stack"><div class="ss-callout"><h3>1 · Warm up the microphone</h3><span>After clicking Start, say:</span><strong data-warmup>“Testing my microphone, one, two, three.”</strong><span class="ss-muted">Wait for the recording cue. The first five seconds are not saved.</span></div><div class="ss-stack"><h3>2 · Then read this passage naturally</h3><p data-passage>${passage}</p></div><button class="ss-primary cursor-interaction" data-action="start-record">Start recording</button></div><div data-reference-fields hidden class="ss-stack"><span data-reference-status class="ss-status">Reference recording ready · 16 seconds</span><label class="ss-label">Exact words in the recording<textarea data-transcript>${passage}</textarea></label><label class="ss-toggle"><input type="checkbox" data-consent>I have permission to use this voice.</label><button class="ss-primary cursor-interaction" data-action="voice-preview" disabled>Create preview</button></div>`, 'Create a presenter');
    }
    function voicePreview(){
      state.voiceStep='preview';
      dialog(`<div class="ss-row ss-between"><h2>Listen, then save</h2><button class="ss-quiet cursor-interaction" data-action="close" aria-label="Close presenter preview">✕</button></div><span class="ss-muted">2 · Preview &amp; save</span><label class="ss-label">Presenter name<input data-voice-name value="${escape(state.voiceName||'')}" aria-label="Presenter name before saving"></label><div class="ss-callout"><span>Preview in ${escape(state.voiceLanguage||'English')}</span><button class="cursor-interaction" data-action="voice-listen"><i data-lucide="play" aria-hidden="true"></i>Listen to preview</button><span class="ss-muted" data-voice-listen-status>Preview ready</span></div><div class="ss-row"><button class="cursor-interaction" data-action="record-again">Record again…</button><button class="ss-quiet cursor-interaction" data-action="voice">Use another audio file…</button></div><label class="ss-toggle"><input type="checkbox">Use as default for new presentations</label><button class="ss-primary ss-full cursor-interaction" data-action="save-voice" ${state.voiceName?.trim()?'':'disabled'}>Save presenter</button>`, 'Preview and save presenter');
    }
    function preparation(kind){
      const missing=state.ready.map((r,i)=>!r&&state.scripts[i].trim()?i:null).filter(i=>i!==null);
      dialog(`<div class="ss-row ss-between"><h2>${kind==='export'?'Export narrated video':'Preview narrated presentation'}</h2><button class="ss-quiet cursor-interaction" data-action="close" aria-label="Close video preparation">✕</button></div><span class="ss-muted">All 6 slides · recordings selected for video</span><div>${missing.length?`<p>${missing.length} slides need current audio.</p><p class="ss-muted">Generate their audio to continue. Ready slides keep their selected recordings.</p>`:'<p>✓ All slides are ready.</p>'}</div>${kind==='export'?'<label class="ss-label">Format<select><option>MP4 · 1080p</option></select></label>':''}<button class="ss-primary ss-full cursor-interaction" data-action="${missing.length?'prepare-audio':kind==='export'?'finish-export':'start-preview'}" data-kind="${kind}">${missing.length?'Generate missing audio':kind==='export'?'Export video':'Play presentation'}</button>`,kind==='export'?'Export video':'Preview presentation');
    }
    app.addEventListener('input',event=>{
      if(event.target.matches('[data-script]')){const start=event.target.selectionStart,end=event.target.selectionEnd;state.scripts[state.slide]=event.target.value;state.ready[state.slide]=false;refresh();event.target.setSelectionRange(start,end);q('[data-script-status]').textContent=event.target.value.trim()?'Saved · regenerate audio to use these changes':'Saved · silent slide, 5 seconds';}
      if(event.target.matches('[data-voice-name]')){state.voiceName=event.target.value;const save=q('[data-action="save-voice"]');if(save)save.disabled=!state.voiceName.trim();}
    });
    app.addEventListener('change',event=>{
      if(event.target.matches('[data-consent]'))q('[data-action="voice-preview"]').disabled=!event.target.checked;
      if(event.target.matches('[data-presenter], [data-language], [data-pace]')){const field=event.target.matches('[data-presenter]')?'presenters':event.target.matches('[data-language]')?'languages':'paces';state[field][state.slide]=event.target.value;state.ready[state.slide]=false;refresh();notice('Only this slide needs new audio. Other slide recordings are unchanged.');}
      if(event.target.matches('[data-voice-language]')){state.voiceLanguage=event.target.value;q('[data-passage]').textContent=state.voiceLanguage==='German'?germanPassage:passage;q('[data-transcript]').value=q('[data-passage]').textContent;q('[data-warmup]').textContent=state.voiceLanguage==='German'?'“Ein kurzer Mikrofontest: eins, zwei, drei.”':'“Testing my microphone, one, two, three.”';}
    });
    app.addEventListener('click',event=>{
      const b=event.target.closest('button');if(!b||!app.contains(b)||b.disabled)return;
      if(b.dataset.tab){setTab(b.dataset.tab);remember();return;}
      if(b.dataset.scope){setScope(b.dataset.scope);refresh();remember();return;}
      if(b.dataset.slide!==undefined){state.slide=Number(b.dataset.slide);setScope('slide');refresh();return;}
      if(b.dataset.use!==undefined){const take=state.takes[Number(b.dataset.use)];state.takes.forEach((t,i)=>t.used=i===Number(b.dataset.use));state.scripts[state.slide]=take.script;state.presenters[state.slide]=take.presenter;state.ready[state.slide]=true;refresh();notice(`${take.name} and its original script are now selected for the video.`);return;}
      if(b.dataset.audition!==undefined){notice(`Auditioning ${state.takes[Number(b.dataset.audition)].name} · simulated playback; video selection stays unchanged.`);return;}
      const action=b.dataset.action;
      if(action==='narration')setTab('narration');
      if(action==='generate'){if(!state.scripts[state.slide].trim()){notice('This is a silent slide. Its default duration is 5 seconds.');return;}state.ready[state.slide]=true;if(state.slide===1){state.takes.forEach(t=>t.used=false);state.takes.unshift({name:`Take ${state.takes.length+1}`,time:'0:24',voice:q('[data-presenter]').value.split(' · ')[0],presenter:q('[data-presenter]').value,script:state.scripts[state.slide],used:true});}refresh();notice('Audio ready. Earlier recordings remain in Recordings.');}
      if(action==='listen'){state.playing=!state.playing;q('[data-time]').textContent=state.playing?'0:08 / 0:24':'0:00 / 0:24';q('[data-track]').style.width=state.playing?'33%':'0%';notice('Playback is simulated in this mockup.');}
      if(action==='draft'){state.scripts[state.slide]='Shared knowledge helps us build on what we already know. Instead of starting from scratch, each team can find useful answers and move the work forward.';state.ready[state.slide]=false;refresh();notice('Draft added for this slide. Review the wording, then generate audio.');}
      if(action==='overview'){const missing=state.ready.filter((r,i)=>!r&&state.scripts[i].trim()).length;dialog(`<div class="ss-row ss-between"><h2>Prepare presentation audio</h2><button class="ss-quiet cursor-interaction" data-action="close" aria-label="Close audio preparation">✕</button></div><p>${missing?`${missing} slides need audio.`:'All slides are ready.'}</p><span class="ss-muted">Existing selected recordings are kept. Edit individual slides using the thumbnails on the left.</span><button class="ss-primary ss-full cursor-interaction" data-action="generate-deck">Generate missing audio</button>`, 'Prepare presentation audio');}
      if(action==='generate-deck'){state.ready=state.ready.map((r,i)=>r||!!state.scripts[i].trim());refresh();if(!q('[data-overlay]').hidden)close();notice('Missing audio generated. Existing selected takes kept.');}
      if(action==='preview'||action==='export')preparation(action);
      if(action==='prepare-audio'){state.ready=state.ready.map((r,i)=>r||!!state.scripts[i].trim());refresh();preparation(b.dataset.kind);}
      if(action==='start-preview'){close();notice('Narrated presentation preview · simulated playback.');}
      if(action==='finish-export'){close();notice('Video export completed · simulation only; no file was created.');}
      if(action==='voice')voiceSource();
      if(action==='record-prep')q('[data-record-prep]').hidden=false;
      if(action==='start-record'){q('[data-record-prep]').hidden=true;q('[data-reference-fields]').hidden=false;q('[data-reference-status]').textContent='Recorded sample · 16 seconds · warm-up discarded (simulation)';}
      if(action==='import-reference'){q('[data-record-prep]').hidden=true;q('[data-reference-fields]').hidden=false;q('[data-reference-status]').textContent='Imported reference.wav · 16 seconds (simulation)';}
      if(action==='voice-preview')voicePreview();
      if(action==='voice-listen'){q('[data-voice-listen-status]').textContent='Simulated playback · no audio is played';}
      if(action==='record-again'){voiceSource();q('[data-record-prep]').hidden=false;}
      if(action==='save-voice'){const name=state.voiceName.trim();state.voices.push(name);const option=document.createElement('option');option.textContent=name;q('[data-presenter]').append(option);state.presenters[state.slide]=name;state.ready[state.slide]=false;refresh();close();notice(`${name} selected for this slide. This mockup does not save a real presenter.`);}
      if(action==='manage'){dialog(`<div class="ss-row ss-between"><h2>Your presenters</h2><button class="ss-quiet cursor-interaction" data-action="close" aria-label="Close presenters">✕</button></div><p class="ss-muted">Saved voices are available across presentations.</p>${state.voices.length?state.voices.map(n=>`<div class="ss-history-row"><span>${escape(n)}</span><button class="cursor-interaction" data-action="rename-voice" data-name="${escape(n)}">Rename</button></div>`).join(''):'<p>No custom presenters yet.</p>'}<button class="ss-primary cursor-interaction" data-action="voice">Create voice…</button>`, 'Manage presenters');}
      if(action==='rename-voice'){state.renameOriginal=b.dataset.name;dialog(`<h2>Rename presenter</h2><label class="ss-label">Name<input data-rename value="${escape(state.renameOriginal)}"></label><div class="ss-row"><button class="ss-primary cursor-interaction" data-action="save-rename">Save name</button><button class="cursor-interaction" data-action="close">Cancel</button></div>`,'Rename presenter');}
      if(action==='save-rename'){const name=q('[data-rename]').value.trim();if(!name)return;state.voices=state.voices.map(n=>n===state.renameOriginal?name:n);state.presenters=state.presenters.map(n=>n===state.renameOriginal?name:n);all('[data-presenter] option').forEach(o=>{if(o.textContent===state.renameOriginal)o.textContent=name;});refresh();close();notice('Presenter renamed in this mockup.');}
      if(action==='defaults'){state.presenters[state.slide]='Ryan · English';state.ready[state.slide]=false;refresh();notice('This slide uses presentation defaults. Other slides are unchanged.');}
      if(action==='draft-deck')notice('Slides without scripts would be drafted for review. Existing scripts are kept.');
      if(action==='home'||action==='present'||action==='chat-send')notice('This prototype focuses on narration; this action is not simulated.');
      if(action==='close')close();
    });
    app.addEventListener('keydown',event=>{if(event.key==='Escape'&&!q('[data-overlay]').hidden)close();if(event.key==='Tab'&&!q('[data-overlay]').hidden){const controls=Array.from(q('[data-dialog]').querySelectorAll('button:not(:disabled),input,select,textarea')).filter(e=>!e.closest('[hidden]'));const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
    setTab(state.tab);setScope('slide');refresh();
    if(globalThis.Tweak){const density={sidebarWidth:348};const tweak=new Tweak({container:app,onChange:()=>app.style.setProperty('--ss-sidebar-width',`${density.sidebarWidth}px`)});tweak.addSlider(density,'sidebarWidth',{label:'Sidebar width',min:300,max:390,step:2,unit:'px'});}
  });
  if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
})();
</script>
